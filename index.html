<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>שיעורי תופים - Firebase</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto; background: #f5f5f5; padding: 16px 16px 32px; }
        .container { max-width: 500px; margin: 0 auto; }
        .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .header h1 { font-size: 24px; font-weight: 600; }
        .stats-box { background: #E6F1FB; border-radius: 12px; padding: 16px; margin-bottom: 20px; text-align: center; }
        .stats-label { font-size: 13px; color: #666; margin-bottom: 8px; }
        .stats-number { font-size: 32px; font-weight: 700; color: #185FA5; }
        .lesson-card { background: white; border: 1px solid #ddd; border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .lesson-info h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
        .lesson-info p { font-size: 12px; color: #999; }
        .lesson-status { font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 6px; margin-bottom: 8px; }
        .status-pending { background: #f0f0f0; color: #999; }
        .status-ok { background: #d4edda; color: #155724; }
        .status-missed { background: #f8d7da; color: #721c24; }
        .lesson-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
        button { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; }
        .btn-yes { background: #28a745; color: white; }
        .btn-no { background: #dc3545; color: white; }
        .btn-reset { background: #6c757d; color: white; padding: 6px 10px; }
        .btn-complete { background: #185FA5; color: white; }
        .info-box { background: white; border-radius: 12px; padding: 14px; margin-top: 20px; border: 1px solid #ddd; }
        .info-box p { font-size: 13px; color: #666; margin: 6px 0; }
        .button-group { display: flex; gap: 8px; margin-top: 20px; }
        .btn-action { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; color: white; }
        .btn-export { background: #185FA5; }
        .btn-import { background: #28a745; }
        #import-file { display: none; }
        .button-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
        .loading-overlay { font-size: 14px; color: #666; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="font-size: 32px;">🥁</div>
            <h1>שיעורי תופים</h1>
        </div>

        <div class="stats-box">
            <div class="stats-label">שיעורים להשלמה</div>
            <div class="stats-number" id="incomplete-count">...</div>
        </div>

        <div id="lessons-container">
            <div class="loading-overlay">מתחבר לענן... ☁️</div>
        </div>

        <div class="info-box">
            <p><strong>עם המורה:</strong> עמית כהן</p>
            <p><strong>ימים:</strong> יום שישי בכל שבוע</p>
            <p><strong>תקופה:</strong> 4 בספטמבר 2026 – 31 ביולי 2027</p>
        </div>

        <div class="button-group">
            <button class="btn-action btn-export" id="export-btn">📥 גבה</button>
            <button class="btn-action btn-import" id="import-btn">📤 שחזור</button>
        </div>

        <input type="file" id="import-file" accept=".json">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // הערכים מהצילום מסך שלך:
        const firebaseConfig = {
            apiKey: "AIzaSyBmRiJM-PgKjQ5324Cf8bbRo57br4mtfFo",
            authDomain: "drums-lessons.firebaseapp.com",
            projectId: "drums-lessons",
            storageBucket: "drums-lessons.firebasestorage.app",
            messagingSenderId: "563052060558",
            appId: "1:563052060558:web:ef7ba9a0b4541a513dcedf"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "drums_app", "amir_lessons");

        let allLessons = [];

        function generateLessons() {
            const lessons = [];
            let date = new Date(2026, 8, 4);
            const endDate = new Date(2027, 6, 31);
            let week = 1;
            while (date <= endDate) {
                lessons.push({
                    id: week,
                    week: week,
                    date: date.toISOString().split('T')[0],
                    status: 'pending'
                });
                date.setDate(date.getDate() + 7);
                week++;
            }
            return lessons;
        }

        async function saveToCloud() {
            try {
                await setDoc(docRef, { lessons: allLessons });
                console.log('✓ נשמר בענן');
            } catch (e) {
                console.error('שגיאה בשמירה:', e);
            }
        }

        async function loadFromCloud() {
            try {
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    allLessons = docSnap.data().lessons;
                } else {
                    allLessons = generateLessons();
                    await saveToCloud();
                }
                render();
            } catch (e) {
                console.error('שגיאה בטעינה:', e);
                document.getElementById('lessons-container').innerHTML = 'שגיאה בחיבור לענן. וודא שהפעלת את Firestore ב-Console.';
            }
        }

        window.markComplete = async (id) => {
            const lesson = allLessons.find(l => l.id === id);
            if (lesson) {
                lesson.status = 'done';
                render();
                await saveToCloud();
            }
        };

        window.markMissed = async (id) => {
            const lesson = allLessons.find(l => l.id === id);
            if (lesson) {
                lesson.status = 'missed';
                render();
                await saveToCloud();
            }
        };

        window.reset = async (id) => {
            const lesson = allLessons.find(l => l.id === id);
            if (lesson) {
                lesson.status = 'pending';
                render();
                await saveToCloud();
            }
        };

        function render() {
            const container = document.getElementById('lessons-container');
            container.innerHTML = '';
            const incomplete = allLessons.filter(l => l.status === 'missed').length;
            document.getElementById('incomplete-count').textContent = incomplete;

            allLessons.forEach(lesson => {
                const date = new Date(lesson.date);
                const dateStr = date.toLocaleDateString('he-IL', { month: 'short', day: 'numeric' });
                let statusText = 'ממתינה', statusClass = 'status-pending';

                if (lesson.status === 'done') { statusText = '✓ הושלם'; statusClass = 'status-ok'; }
                else if (lesson.status === 'missed') { statusText = 'לא התקיים'; statusClass = 'status-missed'; }

                const card = document.createElement('div');
                card.className = 'lesson-card';
                card.innerHTML = `
                    <div class="lesson-info">
                        <h3>שבוע ${lesson.week}</h3>
                        <p>${dateStr}</p>
                    </div>
                    <div class="lesson-actions">
                        <div class="lesson-status ${statusClass}">${statusText}</div>
                        <div class="button-row" id="buttons-${lesson.id}"></div>
                    </div>
                `;
                container.appendChild(card);

                const btnRow = document.getElementById(`buttons-${lesson.id}`);
                if (lesson.status === 'pending') {
                    btnRow.innerHTML = `
                        <button class="btn-yes" onclick="markComplete(${lesson.id})">✓ כן</button>
                        <button class="btn-no" onclick="markMissed(${lesson.id})">✗ לא</button>
                    `;
                } else {
                    btnRow.innerHTML = `<button class="btn-reset" onclick="reset(${lesson.id})">↻ אפס</button>`;
                    if (lesson.status === 'missed') {
                        btnRow.innerHTML += `<button class="btn-complete" onclick="markComplete(${lesson.id})">✓ הושלם</button>`;
                    }
                }
            });
        }

        document.getElementById('export-btn').onclick = () => {
            const blob = new Blob([JSON.stringify(allLessons, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `drums_backup.json`; a.click();
        };

        document.getElementById('import-btn').onclick = () => document.getElementById('import-file').click();
        document.getElementById('import-file').onchange = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = async (evt) => {
                allLessons = JSON.parse(evt.target.result);
                render();
                await saveToCloud();
            };
            reader.readAsText(file);
        };

        loadFromCloud();
    </script>
</body>
</html>
